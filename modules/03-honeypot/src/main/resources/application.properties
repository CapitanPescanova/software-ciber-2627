spring.application.name=honeypot
spring.datasource.url=jdbc:h2:file:${HONEYPOT_DB_PATH:./data/honeypot};DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Para el servicio señuelo SSH
# ssh -p 2222 root@localhost
honeypot.ssh.port=2222
honeypot.ssh.version=OpenSSH_8.9p1 Ubuntu-3ubuntu0.6
honeypot.ssh.hostkey=hostkey.ser
